[package]
name = "peanut_internship_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
ethers = { version = "2", features = ["ws", "rustls"] }
hex = "0.4"
rand = "0.8.1"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.11"
thiserror = "2"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "time", "macros", "signal"] }
zeroize = "1"
eth-keystore = "0.5"
aes-gcm = "0.10"
scrypt = "0.11"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
generic-array = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["rustls", "json"] }
hmac = "0.13"
sha2 = "0.11"
csv = "1.3"
clap = { version = "4", features = ["derive"] }
plotters = "0.3"
plotters-svg = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.29"
futures-util = "0.3"
async-trait = "0.1"
ratatui = "0.30"
crossterm = "0.29"
prometheus = "0.13"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
