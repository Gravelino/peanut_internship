[package]
name = "peanut_internship_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
ethers = "2"
hex = "0.4"
rand = "0.8"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
zeroize = "1"
eth-keystore = "0.5"
aes-gcm = "0.10"
scrypt = "0.11"
generic-array = "0.14"
